name: Test

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
      - name: Run unit tests
        run: go test ./...

  acceptance:
    name: Mock acceptance tests (${{ matrix.cli }} ${{ matrix.version }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Floors: the first Terraform and OpenTofu releases with ephemeral values, which the API key test needs.
        include:
          - cli: terraform
            version: '1.10.*'
          - cli: terraform
            version: '1.12.*'
          - cli: terraform
            version: latest
          - cli: tofu
            version: '1.11.*'
          - cli: tofu
            version: latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false
      - if: matrix.cli == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false
      - run: go mod download
      - name: Run acceptance tests against the in-process mock
        env:
          CLI: ${{ matrix.cli }}
          TF_ACC: '1'
        run: |
          TF_ACC_TERRAFORM_PATH="$(command -v "$CLI")"
          export TF_ACC_TERRAFORM_PATH
          if [ "$CLI" = tofu ]; then
            echo "OpenTofu resolves unqualified providers on its own registry host"
            export TF_ACC_PROVIDER_HOST=registry.opentofu.org
          fi
          "$CLI" version
          go test -race -count=1 -timeout 15m -v ./internal/provider/ -run TestAcc

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ""
          go-version-file: 'go.mod'

  generate:
    name: Docs drift
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: go generate ./...
      - name: git status
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff --compact-summary
            echo "Unexpected difference after code generation. Run 'go generate ./...' and commit."
            exit 1
          fi
